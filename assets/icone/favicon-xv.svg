<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Favicon XV Sarah e Sofia">
  <title>XV Sarah e Sofia</title>
  <desc>Ícone vetorial circular com XV em prata e azul claro, sem fundo.</desc>

  <defs>
    <radialGradient id="bg" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#dceffa"/>
      <stop offset="100%" stop-color="#a9c9dd"/>
    </radialGradient>

    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#eef4f8"/>
      <stop offset="70%" stop-color="#aab7c1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c8d3dc"/>
      <stop offset="75%" stop-color="#8797a3"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#2a5f83" flood-opacity="0.28"/>
    </filter>

    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="2.5" flood-color="#426475" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Fundo transparente por padrão -->

  <!-- Medalhão -->
  <circle cx="256" cy="256" r="226" fill="url(#rim)" filter="url(#softShadow)"/>
  <circle cx="256" cy="256" r="205" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="191" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.95"/>
  <circle cx="256" cy="256" r="219" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55"/>

  <!-- Estrela superior -->
  <g transform="translate(256 92)" fill="#ffffff" opacity="0.98" filter="url(#softShadow)">
    <path d="M0 -45 L8 -8 L44 0 L8 8 L0 45 L-8 8 L-44 0 L-8 -8 Z"/>
    <path d="M0 -26 L4 -4 L26 0 L4 4 L0 26 L-4 4 L-26 0 L-4 -4 Z" opacity="0.65"/>
    <circle cx="0" cy="-64" r="5"/>
    <circle cx="0" cy="64" r="5"/>
    <circle cx="-58" cy="0" r="5"/>
    <circle cx="58" cy="0" r="5"/>
  </g>

  <!-- XV -->
  <g fill="url(#silver)" stroke="#7f909c" stroke-width="2.5" filter="url(#letterShadow)">
    <text x="256" y="310"
          text-anchor="middle"
          font-family="Cinzel, Georgia, 'Times New Roman', serif"
          font-size="225"
          font-weight="600"
          letter-spacing="-12">XV</text>
  </g>

  <!-- Ornamento inferior -->
  <g transform="translate(256 405)" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.96" filter="url(#softShadow)">
    <!-- floco -->
    <path d="M0 -46 V46"/>
    <path d="M-40 -23 L40 23"/>
    <path d="M40 -23 L-40 23"/>
    <path d="M0 -46 L-12 -28"/>
    <path d="M0 -46 L12 -28"/>
    <path d="M0 46 L-12 28"/>
    <path d="M0 46 L12 28"/>
    <path d="M-40 -23 L-21 -22"/>
    <path d="M-40 -23 L-30 -8"/>
    <path d="M40 23 L21 22"/>
    <path d="M40 23 L30 8"/>
    <path d="M40 -23 L21 -22"/>
    <path d="M40 -23 L30 -8"/>
    <path d="M-40 23 L-21 22"/>
    <path d="M-40 23 L-30 8"/>

    <!-- arabescos -->
    <path d="M-78 10 C-123 -4 -131 42 -94 48 C-64 53 -60 18 -82 18"/>
    <path d="M78 10 C123 -4 131 42 94 48 C64 53 60 18 82 18"/>
    <path d="M-102 34 C-132 44 -145 28 -154 14"/>
    <path d="M102 34 C132 44 145 28 154 14"/>
    <circle cx="-166" cy="8" r="4" fill="#ffffff" stroke="none"/>
    <circle cx="166" cy="8" r="4" fill="#ffffff" stroke="none"/>
  </g>
</svg>
